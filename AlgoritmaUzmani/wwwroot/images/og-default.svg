<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5b800"/>
      <stop offset="100%" style="stop-color:#e6a800"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#f5b800" opacity="0.05"/>
  <circle cx="1100" cy="530" r="250" fill="#f5b800" opacity="0.05"/>
  
  <!-- Logo icon -->
  <rect x="500" y="180" width="200" height="200" rx="40" fill="url(#accent)"/>
  <text x="600" y="310" font-family="Arial" font-size="120" fill="#1a1a2e" text-anchor="middle">⚡</text>
  
  <!-- Site name -->
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">Algoritma Uzmanı</text>
  
  <!-- Tagline -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="24" fill="#9ca3af" text-anchor="middle">Veri Yapıları • Algoritmalar • Yazılım Mimarisi</text>
</svg>

